name: Deploy to AWS Lambda

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Instalar dependencias
        run: |
          go env -w GOTOOLCHAIN=auto
          go mod download

      - name: Compilar API Principal
        run: |
          go env -w GOTOOLCHAIN=auto
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=mod -o bootstrap_api ./cmd/api
          # Movemos el binario a su propio zip renombrándolo a bootstrap internamente
          zip -j lambda.zip bootstrap_api
          printf "@ bootstrap_api\n@=bootstrap\n" | zipnote -w lambda.zip

      - name: Compilar Notificaciones (SES)
        run: |
          go env -w GOTOOLCHAIN=auto
          # Compilamos directamente desde la carpeta notifications
          cd notifications
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=mod -o bootstrap main.go
          zip ../notifications.zip bootstrap
          cd ..

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_from_email: "sololarry259@gmail.com"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_from_email: "sololarry259@gmail.com"